<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retailer Hub — Cartix ONDC Store Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --dark: #0f172a;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --card-border: #cbd5e1;
            --chip-bg: #f1f5f9;
            --success-bg: #dcfce7;
            --success-text: #15803d;
            --warning-bg: #fef3c7;
            --warning-text: #b45309;
            --danger-bg: #fee2e2;
            --danger-text: #b91c1c;
        }

        /* Dark Mode Variable Overrides */
        body.dark-theme {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --card-border: #334155;
            --chip-bg: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Toast Notification */
        .admin-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--dark);
            color: #ffffff;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            z-index: 3000;
            opacity: 0;
            transform: translateY(-30px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .admin-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Header Section */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            transition: background-color 0.3s ease;
        }

        .header-left h2 {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-left p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle-btn {
            background: var(--chip-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .theme-toggle-btn:hover {
            background: var(--border);
        }

        .greeting-badge {
            font-size: 12px;
            font-weight: 600;
            color: #4f46e5;
            background: #e0e7ff;
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-logout {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: #fca5a5;
        }

        /* Layout Content */
        main {
            max-width: 1300px;
            margin: 24px auto;
            padding: 0 20px;
        }

        /* Stats Overview Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--card-border);
            padding: 18px;
            border-radius: 12px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.06);
        }

        .stat-card .label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 22px;
            font-weight: 700;
            margin-top: 6px;
            color: var(--text);
        }

        /* Dashboard Split Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
        }

        @media (max-width: 992px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Orders Section & Cards */
        .orders-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .order-card {
            background: var(--surface);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .order-card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.08);
        }

        /* Order Status Update Glow Animation */
        .order-card.status-updated {
            animation: pulseGlow 0.8s ease-in-out;
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5);
            }

            50% {
                transform: scale(1.02);
                box-shadow: 0 0 15px 4px rgba(34, 197, 94, 0.3);
                border-color: #22c55e;
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
            }
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .order-cust-info {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .order-items-list {
            background: var(--bg);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        .status-select {
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--card-border);
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        .status-select:focus,
        .status-select:hover {
            border-color: var(--primary);
        }

        /* Inventory Management Side Box */
        .inventory-card {
            background: var(--surface);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--card-border);
            background: var(--surface);
            color: var(--text);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .catalog-list-mini {
            margin-top: 18px;
            max-height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mini-prod-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div id="adminToast" class="admin-toast"></div>

    <!-- Header -->
    <header>
        <div class="header-left">
            <h2>🏪 <span id="shopTitleHeader">Gorakhpur Central Kirana</span> — Retailer Hub</h2>
            <p>Live inventory control & instant ONDC customer order processing</p>
        </div>

        <div class="header-actions">
            <button class="theme-toggle-btn" id="adminThemeBtn" onclick="toggleAdminTheme()">🌙 Dark</button>
            <span class="greeting-badge" id="adminGreetingBadge">🌅 Good Morning</span>
            <button class="btn-logout" onclick="logoutRetailer()">Logout 🔒</button>
        </div>
    </header>

    <main>
        <!-- Stats Overview Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Total Orders</div>
                <div class="value" id="statOrders">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Revenue</div>
                <div class="value" style="color: #22c55e;" id="statRevenue">₹0</div>
            </div>
            <div class="stat-card">
                <div class="label">In-Stock Catalog</div>
                <div class="value" id="statStock">0 Items</div>
            </div>
            <div class="stat-card">
                <div class="label">Pending Fulfillment</div>
                <div class="value" style="color: #eab308;" id="statPending">0</div>
            </div>
        </div>

        <!-- Main Grid Split -->
        <div class="dashboard-grid">

            <!-- Live Incoming Orders Column -->
            <div>
                <div class="section-title">
                    <span>📦 Incoming Customer Orders</span>
                    <span style="font-size: 12px; font-weight: 500; color: var(--text-muted);">Auto-Sync: 3 sec</span>
                </div>
                <div class="orders-wrapper" id="ordersContainer"></div>
            </div>

            <!-- Add Product & Inventory Control Column -->
            <div>
                <div class="inventory-card">
                    <h3 style="font-size: 15px; margin-bottom: 14px;">➕ Add Catalog Item</h3>

                    <form id="addProductForm" onsubmit="handleAddProduct(event)">
                        <div class="form-group">
                            <label>Product Name</label>
                            <input type="text" id="pTitle" placeholder="e.g. Fortune Mustard Oil (1L)" required>
                        </div>
                        <div class="form-group">
                            <label>Price (₹)</label>
                            <input type="number" id="pPrice" placeholder="e.g. 150" required>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="pCategory">
                                <option value="Dairy & Bakery">🥛 Dairy & Bakery</option>
                                <option value="Grocery & Staples" selected>🌾 Grocery & Staples</option>
                                <option value="Snacks & Packaged Food">🍿 Snacks & Packaged Food</option>
                                <option value="Beverages">🥤 Beverages</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Stock Status</label>
                            <select id="pStock">
                                <option value="IN_STOCK">✅ In Stock</option>
                                <option value="LOW_STOCK">⚠️ Low Stock</option>
                                <option value="OUT_OF_STOCK">❌ Out of Stock</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-submit">+ Save Item to Store</button>
                    </form>

                    <h4 style="font-size: 13px; margin-top: 20px; margin-bottom: 8px;">📦 Active Catalog Items</h4>
                    <div class="catalog-list-mini" id="miniCatalog"></div>
                </div>
            </div>

        </div>
    </main>

    <script>
        function showAdminToast(msg) {
            const toast = document.getElementById('adminToast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function toggleAdminTheme() {
            const isDark = document.body.classList.toggle('dark-theme');
            document.getElementById('adminThemeBtn').innerText = isDark ? '☀️ Light' : '🌙 Dark';
            localStorage.setItem('cartix_admin_theme', isDark ? 'dark' : 'light');
        }

        function initTheme() {
            if (localStorage.getItem('cartix_admin_theme') === 'dark') {
                document.body.classList.add('dark-theme');
                document.getElementById('adminThemeBtn').innerText = '☀️ Light';
            }
        }

        function setAdminGreeting() {
            const hour = new Date().getHours();
            let timeText = "🌅 Good Morning";
            if (hour >= 12 && hour < 17) timeText = "☀️ Good Afternoon";
            else if (hour >= 17 || hour < 5) timeText = "🌙 Good Evening";

            const storeName = localStorage.getItem('selectedStoreName') || "Gorakhpur Central Kirana";
            document.getElementById('shopTitleHeader').innerText = storeName;
            document.getElementById('adminGreetingBadge').innerText = timeText;
        }

        function logoutRetailer() {
            localStorage.removeItem('isRetailerLogged');
            window.location.href = '/';
        }

        async function fetchOrders() {
            try {
                const res = await fetch('/api/orders');
                const orders = await res.json();

                // Update Dashboard Analytics Stats
                document.getElementById('statOrders').innerText = orders.length;
                const totalRev = orders.reduce((sum, o) => sum + (o.totalAmount || 0), 0);
                document.getElementById('statRevenue').innerText = `₹${totalRev}`;

                const pendingCount = orders.filter(o => o.status === 'PENDING' || o.status === 'PACKING').length;
                document.getElementById('statPending').innerText = pendingCount;

                const container = document.getElementById('ordersContainer');
                if (!orders.length) {
                    container.innerHTML = `<div style="text-align:center; padding:30px; background:var(--surface); border:1px solid var(--card-border); border-radius:12px; color:var(--text-muted); font-size:13px;">Abhi koi live order nahi aaya hai.</div>`;
                    return;
                }

                container.innerHTML = orders.map(o => `
          <div class="order-card" id="card-${o.orderId}">
            <div class="order-header">
              <span>🆔 ${o.orderId}</span>
              <span style="color: var(--primary);">₹${o.totalAmount}</span>
            </div>
            <div class="order-cust-info">
              <b>👤 ${o.customerName}</b> (${o.phone}) • 📍 ${o.address}<br>
              <span style="font-size:11px; opacity:0.8;">🕒 Order Time: ${o.createdAt || 'Just now'}</span>
            </div>
            <div class="order-items-list">
              ${(o.items || []).map(i => `<div>• <b>${i.title}</b> (x${i.qty}) - ₹${i.price * i.qty}</div>`).join('')}
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <label style="font-size:11px; margin:0; font-weight:700;">Update Status:</label>
              <select class="status-select" onchange="updateOrderStatus('${o.orderId}', this.value, this)">
                <option value="PENDING" ${o.status === 'PENDING' ? 'selected' : ''}>⏳ Pending</option>
                <option value="PACKING" ${o.status === 'PACKING' ? 'selected' : ''}>📦 Packing</option>
                <option value="DISPATCHED" ${o.status === 'DISPATCHED' ? 'selected' : ''}>🚚 Out for Delivery</option>
                <option value="DELIVERED" ${o.status === 'DELIVERED' ? 'selected' : ''}>✅ Delivered</option>
              </select>
            </div>
          </div>
        `).join('');
            } catch (err) {
                console.error("Error fetching orders:", err);
            }
        }

        async function updateOrderStatus(orderId, newStatus, selectElement) {
            try {
                const orderCard = selectElement.closest('.order-card');

                const res = await fetch(`/api/orders/status/${orderId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });

                if (res.ok) {
                    if (orderCard) {
                        orderCard.classList.add('status-updated');
                        setTimeout(() => orderCard.classList.remove('status-updated'), 800);
                    }
                    showAdminToast(`Order ${orderId} status updated to ${newStatus}!`);
                }
            } catch (err) {
                console.error("Error updating status:", err);
            }
        }

        async function fetchProducts() {
            try {
                const res = await fetch('/api/products');
                const products = await res.json();

                document.getElementById('statStock').innerText = `${products.length} Items`;

                const miniContainer = document.getElementById('miniCatalog');
                miniContainer.innerHTML = products.map(p => `
          <div class="mini-prod-item">
            <div>
              <b>${p.title}</b><br>
              <small style="color:var(--text-muted);">₹${p.price} • ${p.category || 'General'}</small>
            </div>
            <span style="font-size:10px; font-weight:700; color:var(--primary);">${p.stockStatus || 'IN_STOCK'}</span>
          </div>
        `).join('');
            } catch (err) { console.error(err); }
        }

        async function handleAddProduct(e) {
            e.preventDefault();
            const title = document.getElementById('pTitle').value;
            const price = Number(document.getElementById('pPrice').value);
            const category = document.getElementById('pCategory').value;
            const stockStatus = document.getElementById('pStock').value;

            try {
                const res = await fetch('/api/products/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, price, category, stockStatus })
                });

                if (res.ok) {
                    showAdminToast(`✅ "${title}" added to inventory!`);
                    document.getElementById('addProductForm').reset();
                    fetchProducts();
                }
            } catch (err) { console.error(err); }
        }

        document.addEventListener("DOMContentLoaded", () => {
            initTheme();
            setAdminGreeting();
            fetchProducts();
            fetchOrders();
            setInterval(fetchOrders, 3000); // 3-second live auto sync
        });
    </script>
</body>

</html>
