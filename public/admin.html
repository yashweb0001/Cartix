<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retailer Hub — Store Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --dark: #0f172a;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --card-border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .admin-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--dark);
            color: #ffffff;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            z-index: 3000;
            opacity: 0;
            transform: translateY(-30px);
            transition: all 0.3s ease;
        }

        .admin-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        main {
            max-width: 1300px;
            margin: 24px auto;
            padding: 0 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--card-border);
            padding: 18px;
            border-radius: 12px;
        }

        .stat-card .label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-card .value {
            font-size: 22px;
            font-weight: 700;
            margin-top: 6px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 24px;
        }

        .order-card,
        .inventory-card {
            background: var(--surface);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .form-group {
            margin-bottom: 12px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            max-height: 160px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
        }

        .autocomplete-item {
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-clear-catalog {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .catalog-list-mini {
            margin-top: 14px;
            max-height: 380px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .mini-prod-card {
            background: var(--bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stock-toggle-btn {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }

        .stock-toggle-btn.in {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }

        .stock-toggle-btn.low {
            background: #fef3c7;
            color: #b45309;
            border: 1px solid #fcd34d;
        }

        .stock-toggle-btn.out {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            background: var(--surface);
            border-radius: 14px;
            width: 340px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="adminToast" class="admin-toast"></div>

    <div id="confirmClearModal" class="modal-overlay">
        <div class="modal-card">
            <div style="font-size: 32px; margin-bottom: 8px;">🗑️</div>
            <h3 style="font-size: 16px;">Clear Entire Catalog?</h3>
            <p style="font-size: 12px; color: var(--text-muted); margin: 8px 0 18px;">Are you sure you want to remove
                all listed products?</p>
            <div style="display: flex; gap: 10px;">
                <button style="flex:1; padding: 8px; border-radius: 8px; cursor: pointer;"
                    onclick="closeConfirmModal()">Cancel</button>
                <button
                    style="flex:1; background: #ef4444; color: white; border: none; padding: 8px; border-radius: 8px; font-weight: 700; cursor: pointer;"
                    onclick="executeClearCatalog()">Yes, Clear</button>
            </div>
        </div>
    </div>

    <header>
        <div>
            <h2>🏪 <span id="shopTitleHeader">Loading Store...</span></h2>
            <p style="font-size:12px; color:var(--text-muted);">Isolated Retailer Dashboard (ID: <span
                    id="shopIdHeader"></span>)</p>
        </div>
        <div>
            <button onclick="window.location.href='/'" style="padding:6px 12px; cursor:pointer;">⬅️ Back to
                Shop</button>
        </div>
    </header>

    <main>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Store Orders</div>
                <div class="value" id="statOrders">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Store Revenue</div>
                <div class="value" style="color: #22c55e;" id="statRevenue">₹0</div>
            </div>
            <div class="stat-card">
                <div class="label">Active Items</div>
                <div class="value" id="statStock">0 Items</div>
            </div>
        </div>

        <div class="dashboard-grid">
            <div>
                <h3>📦 Orders for My Shop</h3>
                <div id="ordersContainer" style="margin-top:14px;"></div>
            </div>

            <div>
                <div class="inventory-card">
                    <h3>➕ Add Item to My Catalog</h3>
                    <form id="addProductForm" onsubmit="handleAddProduct(event)" style="margin-top:10px;">
                        <div class="form-group">
                            <label>Product Name (Type & Use Arrow Keys + Enter)</label>
                            <input type="text" id="pTitle" placeholder="e.g. Maggi, Milk..." autocomplete="off"
                                oninput="handleTitleSearchInput(this.value)" required>
                            <div class="autocomplete-list" id="autoCompleteList"></div>
                        </div>
                        <div class="form-group"><label>Price (₹)</label><input type="number" id="pPrice" required></div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="pCategory">
                                <option value="Dairy & Bakery">🥛 Dairy & Bakery</option>
                                <option value="Grocery & Staples" selected>🌾 Grocery & Staples</option>
                                <option value="Snacks & Packaged Food">🍿 Snacks</option>
                                <option value="Beverages">🥤 Beverages</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-submit">+ Save to My Store Catalog</button>
                    </form>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
                        <h4>📦 My Listed Items</h4>
                        <button class="btn-clear-catalog" onclick="openConfirmModal()">🗑️ Clear</button>
                    </div>
                    <div class="catalog-list-mini" id="miniCatalog"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const currentShopId = localStorage.getItem('selectedStoreId') || 'shop_1';
        const currentShopName = localStorage.getItem('selectedStoreName') || 'Gorakhpur Central Kirana';

        let localProducts = [];
        let currentFocusIndex = -1;

        // Auto Preset Database for Demo (Restored & Preserved!)
        const kiranaPresetDatabase = [
            { title: 'Maggi 2-Min Noodles (70g)', price: 15, category: 'Snacks & Packaged Food' },
            { title: 'Amul Taaza Milk (1L)', price: 68, category: 'Dairy & Bakery' },
            { title: 'Amul Butter (100g)', price: 58, category: 'Dairy & Bakery' },
            { title: 'Fortune Mustard Oil (1L)', price: 155, category: 'Grocery & Staples' },
            { title: 'Aashirvaad Shuddh Atta (5kg)', price: 245, category: 'Grocery & Staples' },
            { title: 'Tata Salt (1kg)', price: 28, category: 'Grocery & Staples' }
        ];

        function showAdminToast(msg) {
            const toast = document.getElementById('adminToast');
            if (!toast) return;
            toast.innerText = msg; toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function openConfirmModal() { document.getElementById('confirmClearModal').style.display = 'flex'; }
        function closeConfirmModal() { document.getElementById('confirmClearModal').style.display = 'none'; }

        function executeClearCatalog() {
            closeConfirmModal();
            localProducts = [];
            localStorage.setItem(`cartix_custom_catalog_${currentShopId}`, JSON.stringify([]));
            renderMiniCatalog();
            showAdminToast("🗑️ All items cleared!");
        }

        // Search Input with Arrow Key Navigation (Intact)
        function handleTitleSearchInput(val) {
            const list = document.getElementById('autoCompleteList');
            const query = val.toLowerCase().trim();
            currentFocusIndex = -1;

            if (!query) { list.style.display = 'none'; return; }

            const matches = kiranaPresetDatabase.filter(item => item.title.toLowerCase().includes(query));
            if (!matches.length) { list.style.display = 'none'; return; }

            list.innerHTML = matches.map((item, index) => `
                <div class="autocomplete-item" id="auto-item-${index}" onclick="selectAutoCompleteItem('${item.title}', ${item.price}, '${item.category}')">
                    <b>${item.title}</b> — ₹${item.price}
                </div>
            `).join('');
            list.style.display = 'block';
        }

        document.getElementById('pTitle').addEventListener('keydown', function (e) {
            const list = document.getElementById('autoCompleteList');
            if (!list || list.style.display === 'none' || !list.children.length) return;

            const items = list.getElementsByClassName('autocomplete-item');

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                currentFocusIndex++;
                if (currentFocusIndex >= items.length) currentFocusIndex = 0;
                highlightActiveItem(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                currentFocusIndex--;
                if (currentFocusIndex < 0) currentFocusIndex = items.length - 1;
                highlightActiveItem(items);
            } else if (e.key === 'Enter') {
                if (currentFocusIndex > -1 && items[currentFocusIndex]) {
                    e.preventDefault();
                    items[currentFocusIndex].click();
                }
            } else if (e.key === 'Escape') {
                list.style.display = 'none';
            }
        });

        function highlightActiveItem(items) {
            for (let i = 0; i < items.length; i++) {
                items[i].style.background = ''; items[i].style.color = '';
            }
            if (currentFocusIndex >= 0 && currentFocusIndex < items.length) {
                items[currentFocusIndex].style.background = '#4f46e5';
                items[currentFocusIndex].style.color = '#ffffff';
                items[currentFocusIndex].scrollIntoView({ block: 'nearest' });
            }
        }

        function selectAutoCompleteItem(title, price, category) {
            document.getElementById('pTitle').value = title;
            document.getElementById('pPrice').value = price;
            document.getElementById('pCategory').value = category;
            document.getElementById('autoCompleteList').style.display = 'none';
            currentFocusIndex = -1;
            showAdminToast(`⚡ Auto-filled: ${title}`);
        }

        // Fetch ONLY Orders belonging to THIS specific shop ID
        function fetchOrders() {
            const allOrders = JSON.parse(localStorage.getItem('cartix_orders') || '[]');
            const myOrders = allOrders.filter(o => o.shopId === currentShopId || o.storeName === currentShopName);

            document.getElementById('statOrders').innerText = myOrders.length;
            document.getElementById('statRevenue').innerText = `₹${myOrders.reduce((s, o) => s + o.totalAmount, 0)}`;

            const container = document.getElementById('ordersContainer');
            if (!myOrders.length) return container.innerHTML = `<p style="font-size:12px; color:var(--text-muted);">No orders received for ${currentShopName} yet.</p>`;

            container.innerHTML = myOrders.map(o => `
            <div class="order-card">
                <div style="display:flex; justify-content:space-between; font-weight:bold;"><span>🛒 ${o.orderId}</span><span>₹${o.totalAmount}</span></div>
                <div style="font-size:12px; color:var(--text-muted); margin:6px 0;">👤 ${o.customerName} (${o.phone}) 📍 ${o.address}</div>
                
                <!-- NAYA ADDITION: ORDERED ITEMS DIKHANE KE LIYE BINA KUCH HATAAYE -->
                <div style="background: #f1f5f9; padding: 8px; border-radius: 6px; margin: 8px 0; font-size: 11px; border: 1px solid #e2e8f0;">
                    <strong style="display:block; margin-bottom:4px; color:#0f172a;">📦 Items to Pack:</strong>
                    ${o.items ? o.items.map(item => `
                        <div style="display:flex; justify-content:space-between; margin-bottom:3px; color:#475569;">
                            <span>${item.qty} x ${item.title}</span>
                            <span>₹${item.price * item.qty}</span>
                        </div>
                    `).join('') : '<span style="color:red;">No items data</span>'}
                </div>
                <!-- END NAYA ADDITION -->

                ${o.riderName ? `<div style="font-size:11px; color:#2563eb; font-weight:600; margin-bottom:6px;">🛵 Picked up by ${o.riderName} (${o.riderPhone || 'no phone'})</div>` : ''}
                
                <select onchange="updateOrderStatus('${o.orderId}', this.value)" style="padding:4px; border-radius:6px; font-size:12px; width: 100%;">
                    <option value="PENDING" ${o.status === 'PENDING' ? 'selected' : ''}>🕒 Pending</option>
                    <option value="PACKING" ${o.status === 'PACKING' ? 'selected' : ''}>📦 Packing</option>
                    <option value="DISPATCHED" ${o.status === 'DISPATCHED' ? 'selected' : ''}>🚚 Dispatched</option>
                    <option value="DELIVERED" ${o.status === 'DELIVERED' ? 'selected' : ''}>✅ Delivered</option>
                    <option value="CANCELLED" ${o.status === 'CANCELLED' ? 'selected' : ''}>❌ Cancelled (No Stock)</option>
                </select>
            </div>
        `).join('');

            function updateOrderStatus(orderId, status) {
                let orders = JSON.parse(localStorage.getItem('cartix_orders') || '[]');
                const order = orders.find(o => o.orderId === orderId);
                if (order) { order.status = status; localStorage.setItem('cartix_orders', JSON.stringify(orders)); fetchOrders(); }
            }

            // Fetch Products (With Auto-Preset Logic Restored)
            function fetchProducts() {
                const savedData = localStorage.getItem(`cartix_custom_catalog_${currentShopId}`);

                // If data exists (even if it's an empty array from clearing), load it.
                // If it's completely null (new store), auto-populate with preset database!
                if (savedData !== null) {
                    localProducts = JSON.parse(savedData);
                } else {
                    localProducts = kiranaPresetDatabase.map((item, idx) => ({
                        ...item,
                        _id: 'preset_' + Date.now() + '_' + idx,
                        stockStatus: 'IN_STOCK',
                        shopId: currentShopId
                    }));
                    // Save it so it persists for this shop
                    localStorage.setItem(`cartix_custom_catalog_${currentShopId}`, JSON.stringify(localProducts));
                }
                renderMiniCatalog();
            }
            function toggleStockStatus(productId) {
                const prod = localProducts.find(p => p._id === productId);
                if (prod) {
                    // 3-way cycle: IN_STOCK -> LOW_STOCK -> OUT_OF_STOCK -> IN_STOCK
                    if (prod.stockStatus === 'IN_STOCK' || !prod.stockStatus) {
                        prod.stockStatus = 'LOW_STOCK';
                    } else if (prod.stockStatus === 'LOW_STOCK') {
                        prod.stockStatus = 'OUT_OF_STOCK';
                    } else {
                        prod.stockStatus = 'IN_STOCK';
                    }

                    localStorage.setItem(`cartix_custom_catalog_${currentShopId}`, JSON.stringify(localProducts));
                    renderMiniCatalog();
                    showAdminToast(`Stock updated for "${prod.title}"`);
                }
            }
            function renderMiniCatalog() {
                const inStockCount = localProducts.filter(p => p.stockStatus !== 'OUT_OF_STOCK').length;
                document.getElementById('statStock').innerText = `${inStockCount} / ${localProducts.length} Items`;

                const miniContainer = document.getElementById('miniCatalog');
                if (!localProducts.length) {
                    miniContainer.innerHTML = `<p style="font-size:12px; color:var(--text-muted);">No items listed in your store yet.</p>`;
                    return;
                }

                miniContainer.innerHTML = localProducts.map(p => {
                    let btnClass = 'in';
                    let btnText = '✅ In Stock';

                    if (p.stockStatus === 'LOW_STOCK') {
                        btnClass = 'low';
                        btnText = '🔥 Few Left';
                    } else if (p.stockStatus === 'OUT_OF_STOCK') {
                        btnClass = 'out';
                        btnText = '❌ Out of Stock';
                    }

                    return `
    <div class="mini-prod-card">
        <div>
            <b>${p.title}</b><br>
            <small style="color:var(--primary);">₹${p.price}</small>
        </div>
        <button class="stock-toggle-btn ${btnClass}" onclick="toggleStockStatus('${p._id}')">
            ${btnText}
        </button>
    </div>`;
                }).join('');
            }

            function handleAddProduct(e) {
                e.preventDefault();
                const title = document.getElementById('pTitle').value;
                const price = Number(document.getElementById('pPrice').value);
                const category = document.getElementById('pCategory').value;

                localProducts.unshift({ _id: 'item_' + Date.now(), title, price, category, stockStatus: 'IN_STOCK', shopId: currentShopId });
                localStorage.setItem(`cartix_custom_catalog_${currentShopId}`, JSON.stringify(localProducts));
                renderMiniCatalog();
                showAdminToast(`✅ "${title}" added to ${currentShopName}!`);
                e.target.reset();
            }

            // Close dropdown when clicking outside
            document.addEventListener("click", (e) => {
                if (!e.target.closest('.form-group')) {
                    const list = document.getElementById('autoCompleteList');
                    if (list) list.style.display = 'none';
                }
            });

            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById('shopTitleHeader').innerText = currentShopName;
                document.getElementById('shopIdHeader').innerText = currentShopId;
                fetchProducts();
                fetchOrders();
                setInterval(fetchOrders, 2000);
            });
    </script>
</body>

</html>
